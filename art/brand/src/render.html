<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AX-1 brand render</title>
<!-- Rendered by scripts/brand.mjs in a headless browser: ?asset=<name>. Uses the site's own models and fonts. -->
<script type="importmap">
{ "imports": { "three": "/web/vendor/three/three.module.js", "three/addons/": "/web/vendor/three/addons/" } }
</script>
<style>
  @font-face { font-family: "Inter"; src: url("/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter Tight"; src: url("/node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  :root { --paper: #f4efe6; --paper-2: #ebe4d6; --ink: #23211e; --ink-2: #3d3a35; --muted: #6b655c; --line: #d8cfbf; --terra: #b4472f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  #art { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Inter", sans-serif; }
  #art.grid { background-image: linear-gradient(rgba(35,33,30,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(35,33,30,.07) 1px, transparent 1px); background-size: 28px 28px; background-position: -1px -1px; }
  canvas { position: absolute; display: block; }
  .t { position: absolute; }
  .fig { font: 600 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .fig b { color: var(--terra); font-weight: 700; }
  .h { font: 800 44px/1.02 "Inter Tight", sans-serif; letter-spacing: -.035em; margin: 0; }
  .h em { font-style: normal; color: var(--terra); }
  .p { font: 500 17px/1.45 "Inter", sans-serif; color: var(--ink-2); margin: 0; }
  .word { display: flex; align-items: center; gap: .32em; font: 800 64px/1 "Inter Tight", sans-serif; letter-spacing: -.04em; }
  .word b { color: var(--terra); font-weight: 800; }
  .lbl { position: absolute; white-space: nowrap; transform: translateX(-50%); text-align: center; font: 700 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
  .lbl span { display: block; color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border: 1.5px solid #c6bba8; border-radius: 999px; font: 700 12px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: #fbf8f2; }
  svg.dims { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="art"></div>
<script type="module">
import * as THREE from "three";
import { makeRenderer, makeStage, PALETTE } from "/web/js/models/look.js";
import { buildRobot, bounds } from "/web/js/models/robots.js";
import { markSVG } from "./mark.mjs";

const asset = new URLSearchParams(location.search).get("asset") || "logo";
const art = document.getElementById("art");
const el = (html, style = "") => { const d = document.createElement("div"); d.className = "t"; d.style.cssText = style; d.innerHTML = html; art.append(d); return d; };

/** Render robots into a canvas placed at (x, y, w, h). items: [{ id, x (scene), rotY, pose, look, mood }] */
function scene3d({ x, y, w, h, items, fov = 20, elev = 0.32, dist = 1, shadow = 0.22, target = null }) {
  const canvas = document.createElement("canvas");
  Object.assign(canvas.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  art.append(canvas);
  const renderer = makeRenderer(canvas, { alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const st = makeStage(scene, renderer, { size: 1.2, floor: false, background: null });
  st.key.position.set(0.9, 2.2, 1.6);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: shadow }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const group = new THREE.Group();
  scene.add(group);
  for (const it of items) {
    const rig = buildRobot(it.id);
    if (it.pose) rig.pose(it.pose);
    if (it.look) rig.face?.setLook(...it.look);
    if (it.mood) rig.face?.setMood(it.mood);
    rig.face?.tick(0.5);
    rig.group.position.x = it.x || 0;
    rig.group.position.z = it.z || 0;
    rig.group.rotation.y = it.rotY || 0;
    if (it.scale) rig.group.scale.setScalar(it.scale);
    group.add(rig.group);
  }
  const box = new THREE.Box3().setFromObject(group);
  const c = target || box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const camera = new THREE.PerspectiveCamera(fov, w / h, 0.01, 50);
  const r = (Math.max(size.y, size.x / (w / h)) / 2) / Math.tan((fov * Math.PI) / 360) * 1.18 * dist;
  camera.position.set(c.x, c.y + r * elev, c.z + r);
  camera.lookAt(c);
  renderer.render(scene, camera);
  return { camera, canvas, group };
}

const builders = {
  logo() { // 1000 × 1000, circle-safe
    art.style.cssText = "width:1000px;height:1000px";
    el(markSVG({ size: 760, bg: null }), "left:120px;top:110px");
  },
  placeholder() { // the pre-reveal token image, 1000 × 1000
    art.style.cssText = "width:1000px;height:1000px";
    art.classList.add("grid");
    el(markSVG({ size: 520, bg: null, look: [0, 0.6] }).replace(/<ellipse[^>]*>/g, (m) => m.replace(/ry="[\d.]+"/, 'ry="1.3"')), "left:240px;top:170px");
    el(`<div class="fig">FIG. ?? · <b>Dormant agent</b></div>`, "left:64px;top:60px");
    el(`<div class="fig">OpenForge AX · revealed after the sale</div>`, "left:64px;bottom:60px");
  },
  lockup() { // 1200 × 300
    art.style.cssText = "width:1200px;height:300px";
    el(markSVG({ size: 220, bg: null }), "left:40px;top:40px");
    el(`<div class="word">OpenForge <b>AX</b></div><div class="fig" style="margin-top:14px">A phone for a brain. Open for everything else.</div>`, "left:290px;top:92px");
  },
  featured() { // 600 × 400
    art.style.cssText = "width:600px;height:400px";
    art.classList.add("grid");
    scene3d({ x: -10, y: 20, w: 360, h: 370, items: [{ id: "ax1-rover", rotY: -0.65, pose: { head_pan: 18, head_tilt: -8 }, look: [0.6, -0.1] }], elev: 0.45 });
    el(`<div class="fig">FIG. 01 · <b>AX-1</b></div><h1 class="h" style="font-size:38px;margin:12px 0 12px">A phone<br>for a brain.</h1><p class="p" style="font-size:14.5px">Open for everything else.</p>`, "left:340px;top:96px;width:240px");
    el(`<div class="fig">1,024 agents · CC0</div>`, "left:340px;bottom:40px");
  },
  banner() { // 1400 × 350, key content inside the central 700 px
    art.style.cssText = "width:1400px;height:350px";
    art.classList.add("grid");
    const { camera, canvas } = scene3d({
      x: 330, y: 0, w: 740, h: 300, fov: 16, elev: 0.18, dist: 0.95,
      items: [
        { id: "ax1-rover", x: -0.36, rotY: 0.5, look: [0.5, 0] },
        { id: "ax1-desk", x: 0, rotY: 0, pose: { r_shoulder: -140, r_elbow: -60, head_tilt: 6 }, look: [0, 0.2], mood: "happy" },
        { id: "ax1-walker", x: 0.36, rotY: -0.5, look: [-0.5, 0] },
      ],
    });
    void camera; void canvas;
    const labels = [["Rover", "~$100–115"], ["Desk", "~$150–170"], ["Walker", "roadmap"]];
    [497, 700, 903].forEach((x, i) => el(`<div class="lbl" style="left:${x}px;top:290px">${labels[i][0]}<span>${labels[i][1]}</span></div>`));
    el(`<div class="fig">FIG. 01 · <b>AX-1</b> · three bodies, one phone brain</div>`, "left:360px;top:22px");
    el(`<div class="word" style="font-size:40px">OpenForge <b>AX</b></div>`, "left:48px;top:150px");
    el(`<div class="fig" style="text-align:right">An open robotics lab · CC0</div>`, "right:48px;top:162px");
  },
  og() { // 1200 × 630
    art.style.cssText = "width:1200px;height:630px";
    art.classList.add("grid");
    scene3d({ x: 640, y: 40, w: 560, h: 560, items: [{ id: "ax1-desk", rotY: -0.45, pose: { head_pan: -28, head_tilt: 6, l_shoulder: -110, l_elbow: -40 }, look: [-0.8, 0.1], mood: "happy" }], elev: 0.3 });
    el(`<div class="word" style="font-size:34px">${markSVG({ size: 46, bg: null })}OpenForge <b>AX</b></div>`, "left:72px;top:64px");
    el(`<h1 class="h" style="font-size:72px">Build a robot.<br><em>Your phone<br>is the brain.</em></h1>`, "left:72px;top:170px");
    el(`<div class="chips"><span class="chip">Learn</span><span class="chip">Test</span><span class="chip">Build</span><span class="chip">Pilot</span></div>`, "left:72px;top:500px");
  },
  xheader() { // 1500 × 500 (X crops top/bottom on mobile; the avatar covers the lower left)
    art.style.cssText = "width:1500px;height:500px";
    art.classList.add("grid");
    scene3d({
      x: 820, y: 30, w: 640, h: 440, fov: 16, elev: 0.2,
      items: [
        { id: "ax1-rover", x: -0.34, rotY: 0.55, look: [0.4, 0] },
        { id: "ax1-desk", x: 0, look: [-0.6, 0.2], mood: "happy", pose: { head_pan: -20 } },
        { id: "ax1-walker", x: 0.34, rotY: -0.5, look: [-0.5, 0] },
      ],
    });
    el(`<div class="fig">FIG. 01 · <b>AX-1</b></div><h1 class="h" style="font-size:60px;margin-top:14px">A phone for a brain.<br><em>Open for everything else.</em></h1>`, "left:300px;top:150px;width:520px");
  },
};

builders[asset]?.();
await document.fonts.ready;
window.__ready = { width: art.offsetWidth, height: art.offsetHeight };
</script>
</body>
</html>
