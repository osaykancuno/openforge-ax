# Publishes a PREVIEW copy of the static site (web/) to GitHub Pages on every push to main:
# https://osaykancuno.github.io/openforge-ax/ (the production site is https://openforge-ax.tech, see cloudflare.yml).
# web/ is already built and committed (npm run web:build), so this only copies it. Until the launch the copy is a
# preview: no local-demo config (visitors' browsers never contact 127.0.0.1) and no search-engine indexing.
# GitHub Pages ignores web/_headers; the CSP is a <meta> tag in each page and theme-boot.js blocks framing.
# Actions are pinned to a full commit SHA (the tag is the trailing comment): a moved tag cannot change what runs here.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # the same copy as the production site (scripts/prepare-site.mjs: vendored files checked, the local demo's config
      # replaced by the public defaults, no loopback hosts in any CSP but the Phone Brain's), minus what GitHub Pages
      # ignores, and never indexed: the real site is https://openforge-ax.tech
      - name: Prepare the preview copy
        run: node scripts/prepare-site.mjs --target github --out _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
